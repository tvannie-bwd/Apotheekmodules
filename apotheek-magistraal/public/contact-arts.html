<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact arts</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 0 16px;
      color: #1a1a1a;
    }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    h2 { font-size: 1.05rem; margin: 24px 0 8px; color: #333; }
    p.subtitle { color: #666; margin-top: 0; }
    a.module-link { font-size: 0.85rem; color: #2b6cb0; }

    .formulier {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      display: grid;
      gap: 8px;
    }
    .formulier .row {
      display: grid;
      grid-template-columns: 1.1fr 1.1fr 1fr 0.9fr;
      gap: 8px;
    }
    label { font-size: 0.85rem; color: #555; margin-bottom: 2px; display: block; }
    input, textarea, select {
      width: 100%;
      font-family: inherit;
      font-size: 1rem;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: white;
    }
    textarea { min-height: 70px; resize: vertical; }

    button {
      padding: 8px 16px;
      font-size: 0.95rem;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f5f5f5;
    }
    button.primary { background: #2b6cb0; color: white; border-color: #2b6cb0; }
    button.danger { background: #fff; color: #c53030; border-color: #c53030; }

    .print-btn { font-size: 0.85rem; margin-left: 8px; }
    .clear-banner {
      background: #eaf3ff;
      border: 1px solid #90b8e0;
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 10px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .clear-banner button { font-size: 0.85rem; padding: 4px 10px; }

    .contact {
      border: 1px solid #e2e2e2;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 6px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .contact input[type="checkbox"] {
      width: auto;
      margin-top: 3px;
      transform: scale(1.15);
      cursor: pointer;
    }
    .contact-body { flex: 1; }
    .contact-header {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .item-naam { font-weight: 600; font-size: 0.95rem; }
    .contact-datum { font-size: 0.82rem; color: #2b6cb0; font-weight: 600; }
    .onderwerp { color: #444; font-size: 0.88rem; font-style: italic; margin-top: 2px; }
    .verslag { color: #333; margin: 6px 0 0; white-space: pre-wrap; font-size: 0.9rem; }
    .meta { font-size: 0.74rem; color: #999; margin-top: 6px; }
    .contact-actions { margin-top: 6px; }
    .notities-lijst { margin-top: 8px; }
    .notitie-item {
      background: #f7fafd; border: 1px solid #dce8f5; border-radius: 4px;
      padding: 6px 8px; margin-bottom: 4px; font-size: 0.85rem;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    }
    .notitie-item .notitie-datum { color: #2b6cb0; font-size: 0.72rem; font-weight: 600; display: block; margin-bottom: 2px; }
    .notitie-item .notitie-inhoud { flex: 1; }
    .notitie-verwijder-btn {
      font-size: 0.72rem; padding: 2px 6px; border: 1px solid #e0b0b0; color: #c53030;
      background: white; border-radius: 3px; cursor: pointer; white-space: nowrap;
    }
    .notitie-toevoegen { display: flex; gap: 6px; margin-top: 6px; }
    .notitie-toevoegen input { flex: 1; font-size: 0.88rem; padding: 6px; }
    .notitie-toevoegen button { font-size: 0.85rem; padding: 6px 10px; white-space: nowrap; }

    #status { font-size: 0.9rem; color: #555; margin-bottom: 16px; min-height: 1.2em; }
    .empty { color: #888; font-style: italic; }

    .pin-dot {
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid #2b6cb0; background: transparent; transition: background 0.15s;
    }
    .pin-dot.gevuld { background: #2b6cb0; }
    .pin-toets {
      font-size: 1.3rem; padding: 14px 0; border: 1px solid #ccc;
      border-radius: 6px; background: #f5f5f5; cursor: pointer;
    }
    .pin-toets:active { background: #e2e2e2; }

    footer.maker-balk {
      margin-top: 32px;
      padding: 10px 0;
      border-top: 1px solid #e2e2e2;
      text-align: center;
      font-size: 0.78rem;
      color: #999;
    }

    @media print {
      .tabs, .formulier, #status, .print-btn, .clear-banner, a.module-link, footer.maker-balk { display: none !important; }
      .contact-actions { display: none !important; }
      .contact { break-inside: avoid; border-color: #999; }
      p.subtitle { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="login-overlay" style="position:fixed; inset:0; background:rgba(255,255,255,0.97); display:flex; align-items:center; justify-content:center; z-index:1000;">
    <div style="max-width:340px; width:100%; padding:24px; border:1px solid #ddd; border-radius:8px; text-align:center;">
      <h2 style="margin-top:0;">Aanmelden</h2>

      <div style="display:flex; gap:4px; margin-bottom:12px; border-bottom:1px solid #ddd;">
        <button class="login-tab active" data-mode="login" style="flex:1; padding:8px; border:none; background:none; border-bottom:2px solid #2b6cb0; color:#2b6cb0; font-weight:600; cursor:pointer;">Inloggen</button>
        <button class="login-tab" data-mode="register" style="flex:1; padding:8px; border:none; background:none; border-bottom:2px solid transparent; color:#555; cursor:pointer;">Nieuwe apotheek</button>
      </div>

      <div style="text-align:left; margin-bottom:8px;">
        <label for="login-apotheeknaam">Naam van je apotheek</label>
        <input id="login-apotheeknaam" type="text" placeholder="bv. Apotheek Peeters" />
      </div>

      <div id="veld-uitnodigingscode" style="text-align:left; margin-bottom:8px; display:none;">
        <label for="register-uitnodigingscode">Uitnodigingscode</label>
        <input id="register-uitnodigingscode" type="text" placeholder="Code die je van mij kreeg" />
      </div>

      <p style="font-size:0.9rem; color:#666; margin-bottom:4px;">Code</p>
      <div id="pin-dots" style="display:flex; justify-content:center; gap:12px; margin-bottom:16px;"></div>
      <div id="pin-keypad" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:8px;"></div>
      <p id="login-fout" style="color:#c53030; font-size:0.85rem; min-height:1.2em; margin-bottom:0;"></p>
    </div>
  </div>

  <h1>Contact arts</h1>
  <p class="subtitle" id="aangemeld-als" style="display:none;"></p>
  <p class="subtitle">
    <a class="module-link" href="/">← Naar Magistraal</a> ·
    <a class="module-link" href="/bestellingen.html">Speciale bestellingen</a> ·
    <a class="module-link" href="/mutualiteiten.html">Mutualiteiten</a> ·
    <a class="module-link" href="/huisbereidingen.html">Huisbereidingen →</a>
  </p>

  <div id="status"></div>

  <div class="formulier">
    <div class="row">
      <div>
        <label for="new-arts">Naam arts</label>
        <input id="new-arts" type="text" placeholder="Naam van de arts" />
      </div>
      <div>
        <label for="new-patient">Naam patiënt</label>
        <input id="new-patient" type="text" placeholder="Naam van de patiënt" />
      </div>
      <div>
        <label for="new-datum">Datum contact</label>
        <input id="new-datum" type="date" />
      </div>
      <div>
        <label for="new-uur">Uur contact</label>
        <div style="display:flex; gap:4px;">
          <select id="new-uur" style="flex:1;"></select>
          <select id="new-minuut" style="flex:1;">
            <option value="00">00</option>
            <option value="30">30</option>
          </select>
        </div>
      </div>
    </div>
    <div>
      <label for="new-onderwerp">Onderwerp (optioneel)</label>
      <input id="new-onderwerp" type="text" placeholder="bv. dosisaanpassing, vraag over interactie..." />
    </div>
    <div>
      <label for="new-verslag">Vervolgverslag</label>
      <textarea id="new-verslag" placeholder="Wat werd besproken/afgesproken tijdens het telefonisch contact..."></textarea>
    </div>
    <button class="primary" id="add-btn">Toevoegen</button>
  </div>

  <h2>Contactenboek <button class="print-btn" onclick="afdrukken()">Afdrukken</button></h2>
  <div id="clear-banner" class="clear-banner" style="display:none;">
    Contactenboek afgedrukt. Nu leegmaken?
    <button class="primary" onclick="leegContactenboek()">Ja, leegmaken</button>
    <button onclick="verbergLeegBanner()">Nee, laten staan</button>
  </div>
  <div id="geschiedenis-list"></div>
  <p class="empty" id="geschiedenis-empty" style="display:none;">Nog geen contacten geregistreerd.</p>

  <script>
    const API = "/api/contact-arts";
    const status = document.getElementById("status");
    let sessieToken = localStorage.getItem("magistraal-token"); // gedeeld met de andere modules

    function setStatus(msg) { status.textContent = msg; }

    async function apiFetch(url, options = {}) {
      const headers = { ...(options.headers || {}), Authorization: `Bearer ${sessieToken}` };
      const res = await fetch(url, { ...options, headers, cache: "no-store" });
      if (res.status === 401) {
        localStorage.removeItem("magistraal-token");
        localStorage.removeItem("magistraal-apotheeknaam");
        sessieToken = null;
        toonAangemeldAls(null);
        toonLoginOverlay(true);
        throw new Error("Sessie verlopen, gelieve opnieuw aan te melden.");
      }
      return res;
    }

    function formatDatum(isoDateTime) {
      if (!isoDateTime) return "";
      const [datumDeel, uurDeel] = isoDateTime.split("T");
      const [y, m, d] = datumDeel.split("-");
      const uur = uurDeel ? uurDeel.slice(0, 5) : "";
      return `${d}/${m}/${y}` + (uur ? ` om ${uur}` : "");
    }
    function formatDatumTijd(iso) {
      if (!iso) return "";
      return new Date(iso).toLocaleString("nl-BE", {
        day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit",
      });
    }

    let herbevestigBezig = false;
    async function herbevestigOnbevestigd() {
      if (herbevestigBezig) return;
      herbevestigBezig = true;
      const tussenpozen = [2000, 3000, 4000, 5000, 6000];
      for (const wachttijd of tussenpozen) {
        if (onbevestigd.length === 0) break;
        await new Promise((r) => setTimeout(r, wachttijd));
        if (onbevestigd.length === 0) break;
        await loadContacten(true);
      }
      herbevestigBezig = false;
    }

    let huidigeLijst = [];
    let onbevestigd = [];

    function renderAlles() {
      renderLijst("geschiedenis-list", "geschiedenis-empty", huidigeLijst);
    }

    async function loadContacten(stil = false) {
      if (!stil) setStatus("Bezig met laden...");
      try {
        const res = await apiFetch(`${API}?_=${Date.now()}`);
        if (!res.ok) throw new Error(await res.text());
        const vers = await res.json();

        onbevestigd = onbevestigd.filter((o) => {
          const aanwezig = vers.lijst.some((x) => x.id === o.id);
          if (!aanwezig) {
            vers.lijst = [o, ...vers.lijst];
          }
          return !aanwezig;
        });

        huidigeLijst = vers.lijst;
        renderAlles();
        setStatus("Bijgewerkt om " + new Date().toLocaleTimeString());
      } catch (err) {
        setStatus("Fout bij laden: " + err.message);
      }
    }

    function renderLijst(containerId, emptyId, lijst) {
      const container = document.getElementById(containerId);
      const empty = document.getElementById(emptyId);
      container.innerHTML = "";
      empty.style.display = lijst.length === 0 ? "block" : "none";
      for (const b of lijst) {
        const el = document.createElement("div");
        el.className = "contact";
        el.dataset.id = b.id;
        el.innerHTML = `
          <div class="contact-body">
            <div class="contact-header">
              <span class="item-naam"></span>
              <span class="contact-datum"></span>
            </div>
            <div class="onderwerp"></div>
            <div class="verslag"></div>
            <div class="notities-lijst"></div>
            <div class="notitie-toevoegen">
              <input type="text" class="nieuwe-notitie-veld" placeholder="Extra notitie toevoegen..." />
              <button class="notitie-btn">Toevoegen</button>
            </div>
            <div class="meta"></div>
            <div class="contact-actions"><button class="danger delete-btn">Verwijderen</button></div>
          </div>
        `;
        el.querySelector(".item-naam").textContent = `Dr. ${b.arts} — ${b.patient}`;
        el.querySelector(".contact-datum").textContent = formatDatum(b.contactDatum);
        el.querySelector(".onderwerp").textContent = b.onderwerp || "";
        el.querySelector(".verslag").textContent = b.verslag || "";
        el.querySelector(".meta").textContent = "Geregistreerd: " + formatDatumTijd(b.aangemaakt);

        const notitiesLijst = el.querySelector(".notities-lijst");
        for (const n of b.notities || []) {
          notitiesLijst.appendChild(maakNotitieElement(b.id, n, notitiesLijst));
        }

        const notitieVeld = el.querySelector(".nieuwe-notitie-veld");
        const notitieToevoegen = () => voegNotitieToe(b.id, notitieVeld, notitiesLijst);
        el.querySelector(".notitie-btn").addEventListener("click", notitieToevoegen);
        notitieVeld.addEventListener("keydown", (e) => {
          if (e.key === "Enter") notitieToevoegen();
        });

        koppelVerwijderKnop(el.querySelector(".delete-btn"), b.id);
        container.appendChild(el);
      }
    }

    function maakNotitieElement(contactId, notitie, notitiesLijst) {
      const item = document.createElement("div");
      item.className = "notitie-item";
      item.innerHTML = `
        <div class="notitie-inhoud">
          <span class="notitie-datum"></span>
          <span class="notitie-tekst"></span>
        </div>
        <button class="notitie-verwijder-btn">×</button>
      `;
      item.querySelector(".notitie-datum").textContent = formatDatumTijd(notitie.datum);
      item.querySelector(".notitie-tekst").textContent = notitie.tekst;

      const verwijderBtn = item.querySelector(".notitie-verwijder-btn");
      let bevestigen = false;
      let timeoutId;
      verwijderBtn.addEventListener("click", () => {
        if (!bevestigen) {
          bevestigen = true;
          verwijderBtn.textContent = "Zeker?";
          timeoutId = setTimeout(() => { bevestigen = false; verwijderBtn.textContent = "×"; }, 3000);
        } else {
          clearTimeout(timeoutId);
          verwijderNotitie(contactId, notitie.id, item);
        }
      });
      return item;
    }

    async function verwijderNotitie(contactId, notitieId, itemEl) {
      try {
        const res = await apiFetch(`${API}?id=${contactId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ verwijderNotitieId: notitieId }),
        });
        if (!res.ok) throw new Error(await res.text());
        const bijgewerkt = await res.json();
        const item = huidigeLijst.find((x) => x.id === contactId);
        if (item) item.notities = bijgewerkt.notities;
        itemEl.remove();
        setStatus("Notitie verwijderd.");
      } catch (err) {
        setStatus("Fout bij verwijderen van notitie: " + err.message);
      }
    }

    async function voegNotitieToe(id, notitieVeld, notitiesLijst) {
      const tekst = notitieVeld.value.trim();
      if (!tekst) return;
      try {
        const res = await apiFetch(`${API}?id=${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nieuweNotitie: tekst }),
        });
        if (!res.ok) throw new Error(await res.text());
        const bijgewerkt = await res.json();

        const item = huidigeLijst.find((x) => x.id === id);
        if (item) item.notities = bijgewerkt.notities;

        const laatsteNotitie = bijgewerkt.notities[bijgewerkt.notities.length - 1];
        notitiesLijst.appendChild(maakNotitieElement(id, laatsteNotitie, notitiesLijst));

        notitieVeld.value = "";
        setStatus("Notitie toegevoegd.");
      } catch (err) {
        setStatus("Fout bij toevoegen van notitie: " + err.message);
      }
    }

    async function voegContactToe() {
      const arts = document.getElementById("new-arts").value.trim();
      const patient = document.getElementById("new-patient").value.trim();
      const datumVeld = document.getElementById("new-datum").value;
      const uurVeld = document.getElementById("new-uur").value;
      const minuutVeld = document.getElementById("new-minuut").value;
      const onderwerp = document.getElementById("new-onderwerp").value.trim();
      const verslag = document.getElementById("new-verslag").value.trim();

      if (!arts || !patient || !datumVeld || !verslag) {
        setStatus("Naam arts, naam patiënt, datum/uur en vervolgverslag zijn verplicht.");
        return;
      }
      const contactDatum = `${datumVeld}T${uurVeld}:${minuutVeld}`;
      setStatus("Bezig met opslaan...");
      try {
        const res = await apiFetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ arts, patient, contactDatum, onderwerp, verslag }),
        });
        if (!res.ok) throw new Error(await res.text());
        const nieuw = await res.json();

        huidigeLijst = [nieuw, ...huidigeLijst];
        onbevestigd.push(nieuw.id);
        renderAlles();
        setStatus("Toegevoegd.");

        document.getElementById("new-arts").value = "";
        document.getElementById("new-patient").value = "";
        document.getElementById("new-onderwerp").value = "";
        document.getElementById("new-verslag").value = "";
        vulStandaardDatumTijdIn();

        herbevestigOnbevestigd();
      } catch (err) {
        setStatus("Fout bij opslaan: " + err.message);
      }
    }

    async function verwijderContact(id) {
      setStatus("Bezig met verwijderen...");
      try {
        const res = await apiFetch(`${API}?id=${id}`, { method: "DELETE" });
        if (!res.ok) throw new Error(await res.text());
        await loadContacten();
      } catch (err) {
        setStatus("Fout bij verwijderen: " + err.message);
      }
    }

    function koppelVerwijderKnop(button, id) {
      let bevestigen = false;
      let timeoutId;
      button.addEventListener("click", () => {
        if (!bevestigen) {
          bevestigen = true;
          button.textContent = "Zeker? Klik opnieuw";
          timeoutId = setTimeout(() => {
            bevestigen = false;
            button.textContent = "Verwijderen";
          }, 3000);
        } else {
          clearTimeout(timeoutId);
          verwijderContact(id);
        }
      });
    }

    let laatsteAfdrukType = null;
    function afdrukken() { laatsteAfdrukType = true; window.print(); }
    window.addEventListener("afterprint", () => {
      if (laatsteAfdrukType) {
        document.getElementById("clear-banner").style.display = "flex";
        laatsteAfdrukType = null;
      }
    });
    function verbergLeegBanner() { document.getElementById("clear-banner").style.display = "none"; }
    async function leegContactenboek() {
      verbergLeegBanner();
      const idsLijst = Array.from(document.getElementById("geschiedenis-list").children).map((el) => el.dataset.id);
      setStatus("Bezig met leegmaken...");
      try {
        for (const id of idsLijst) {
          const res = await apiFetch(`${API}?id=${id}`, { method: "DELETE" });
          if (!res.ok) throw new Error(await res.text());
        }
        await loadContacten();
        setStatus("Contactenboek geleegd.");
      } catch (err) {
        setStatus("Fout bij leegmaken: " + err.message);
      }
    }

    document.getElementById("add-btn").addEventListener("click", voegContactToe);

    function vulUrenlijstIn() {
      const select = document.getElementById("new-uur");
      select.innerHTML = "";
      for (let h = 8; h <= 18; h++) {
        const opt = document.createElement("option");
        opt.value = String(h).padStart(2, "0");
        opt.textContent = String(h).padStart(2, "0");
        select.appendChild(opt);
      }
    }
    function vulStandaardDatumTijdIn() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      let uur = Math.min(Math.max(now.getHours(), 8), 18);
      let minuut = now.getMinutes() < 30 ? "00" : "30";
      document.getElementById("new-datum").value =
        `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
      document.getElementById("new-uur").value = pad(uur);
      document.getElementById("new-minuut").value = minuut;
    }

    // ---- Login (identiek aan de andere modules, zelfde accounts) ----
    const PIN_LENGTE = 4;
    let ingevoerdeCode = "";
    let loginModus = "login";

    function toonLoginOverlay(tonen) {
      document.getElementById("login-overlay").style.display = tonen ? "flex" : "none";
    }
    function toonAangemeldAls(apotheeknaam) {
      const el = document.getElementById("aangemeld-als");
      if (sessieToken) {
        el.innerHTML = apotheeknaam
          ? `Aangemeld als: <strong>${apotheeknaam}</strong> — <a href="#" id="uitloggen-link">uitloggen</a>`
          : `Aangemeld — <a href="#" id="uitloggen-link">uitloggen</a>`;
        el.style.display = "block";
        document.getElementById("uitloggen-link").addEventListener("click", (e) => { e.preventDefault(); uitloggen(); });
      } else {
        el.style.display = "none";
      }
    }
    function uitloggen() {
      localStorage.removeItem("magistraal-token");
      localStorage.removeItem("magistraal-apotheeknaam");
      sessieToken = null;
      toonAangemeldAls(null);
      toonLoginOverlay(true);
    }

    document.querySelectorAll(".login-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".login-tab").forEach((t) => {
          t.classList.remove("active"); t.style.borderBottomColor = "transparent";
          t.style.color = "#555"; t.style.fontWeight = "normal";
        });
        tab.classList.add("active");
        tab.style.borderBottomColor = "#2b6cb0"; tab.style.color = "#2b6cb0"; tab.style.fontWeight = "600";
        loginModus = tab.dataset.mode;
        document.getElementById("veld-uitnodigingscode").style.display = loginModus === "register" ? "block" : "none";
        document.getElementById("login-fout").textContent = "";
      });
    });

    function tekenPinDots() {
      const container = document.getElementById("pin-dots");
      container.innerHTML = "";
      for (let i = 0; i < PIN_LENGTE; i++) {
        const dot = document.createElement("div");
        dot.className = "pin-dot" + (i < ingevoerdeCode.length ? " gevuld" : "");
        container.appendChild(dot);
      }
    }
    function tekenPinKeypad() {
      const container = document.getElementById("pin-keypad");
      container.innerHTML = "";
      const toetsen = ["1","2","3","4","5","6","7","8","9","wis","0","⌫"];
      for (const t of toetsen) {
        const btn = document.createElement("button");
        btn.className = "pin-toets";
        btn.textContent = t === "wis" ? "Wis" : t;
        btn.addEventListener("click", () => {
          if (t === "⌫") ingevoerdeCode = ingevoerdeCode.slice(0, -1);
          else if (t === "wis") ingevoerdeCode = "";
          else if (ingevoerdeCode.length < PIN_LENGTE) ingevoerdeCode += t;
          tekenPinDots();
          document.getElementById("login-fout").textContent = "";
          if (ingevoerdeCode.length === PIN_LENGTE) probeerInloggen();
        });
        container.appendChild(btn);
      }
    }
    document.addEventListener("keydown", (e) => {
      if (document.getElementById("login-overlay").style.display === "none") return;
      if (document.activeElement && document.activeElement.tagName === "INPUT") return;
      if (e.key >= "0" && e.key <= "9" && ingevoerdeCode.length < PIN_LENGTE) {
        ingevoerdeCode += e.key; tekenPinDots();
        if (ingevoerdeCode.length === PIN_LENGTE) probeerInloggen();
      } else if (e.key === "Backspace") {
        ingevoerdeCode = ingevoerdeCode.slice(0, -1); tekenPinDots();
      }
    });

    async function probeerInloggen() {
      const foutVeld = document.getElementById("login-fout");
      foutVeld.textContent = "";
      const apotheeknaam = document.getElementById("login-apotheeknaam").value.trim();
      if (!apotheeknaam) { foutVeld.textContent = "Naam van de apotheek is verplicht."; return; }
      const eindpunt = loginModus === "register" ? "/api/register" : "/api/login";
      const body = loginModus === "register"
        ? { uitnodigingscode: document.getElementById("register-uitnodigingscode").value.trim(), apotheeknaam, code: ingevoerdeCode }
        : { apotheeknaam, code: ingevoerdeCode };
      try {
        const res = await fetch(eindpunt, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) {
          foutVeld.textContent = data.error || "Aanmelden mislukt.";
          ingevoerdeCode = ""; tekenPinDots();
          return;
        }
        sessieToken = data.token;
        localStorage.setItem("magistraal-token", sessieToken);
        localStorage.setItem("magistraal-apotheeknaam", data.apotheeknaam || apotheeknaam);
        toonAangemeldAls(data.apotheeknaam || apotheeknaam);
        toonLoginOverlay(false);
        loadContacten();
      } catch (err) {
        foutVeld.textContent = "Fout bij aanmelden: " + err.message;
        ingevoerdeCode = ""; tekenPinDots();
      }
    }

    tekenPinKeypad();
    tekenPinDots();
    vulUrenlijstIn();
    vulStandaardDatumTijdIn();

    if (sessieToken) {
      toonAangemeldAls(localStorage.getItem("magistraal-apotheeknaam"));
      toonLoginOverlay(false);
      loadContacten();
    } else {
      toonLoginOverlay(true);
    }
  </script>
